services:
  # --- Second Brain Unified Full-Stack Application (Next.js + SQLite) ---
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: second-brain
    restart: unless-stopped
    ports:
      - "${HOST_PORT:-${PORT:-3000}}:3000"
    env_file:
      - path: .env
        required: false
    environment:
      - PORT=3000
      - NODE_ENV=production
      - DB_CLIENT=sqlite
      - SQLITE_DB_PATH=/app/db/second_brain.sqlite
      # Required: no default. Generate one with:
      # node -e "console.log(require('crypto').randomBytes(64).toString('hex'))"
      - JWT_ACCESS_SECRET=${JWT_ACCESS_SECRET:?JWT_ACCESS_SECRET must be set in .env (see README)}
      - JWT_ACCESS_EXPIRES_IN=${JWT_ACCESS_EXPIRES_IN:-15m}
      - JWT_REFRESH_EXPIRES_IN_DAYS=${JWT_REFRESH_EXPIRES_IN_DAYS:-30}
    volumes:
      # Host directory where SQLite database file is stored on your server
      - "${SQLITE_HOST_DIR:-./db}:/app/db"


# SQLite data volume: a static hostPath PersistentVolume on the node's local disk.
# Change the path below to wherever you want the database to live, or let deploy.sh
# set it for you (DATA_DIR=/your/path ./deploy/k3s/deploy.sh <domain>).
# SQLite needs a local, POSIX-locking disk: do not point this at NFS/SMB-backed storage.
apiVersion: v1
kind: PersistentVolume
metadata:
  name: second-brain-data
  labels:
    app.kubernetes.io/name: second-brain
spec:
  capacity:
    storage: 2Gi
  accessModes:
    - ReadWriteOnce
  # Retain: deleting the claim or namespace never deletes your database.
  persistentVolumeReclaimPolicy: Retain
  storageClassName: manual
  hostPath:
    path: /var/lib/second-brain/data
    type: DirectoryOrCreate
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: second-brain-data
  labels:
    app.kubernetes.io/name: second-brain
spec:
  accessModes:
    - ReadWriteOnce
  storageClassName: manual
  volumeName: second-brain-data
  resources:
    requests:
      storage: 2Gi

apiVersion: apps/v1
kind: Deployment
metadata:
  name: second-brain
  labels:
    app.kubernetes.io/name: second-brain
spec:
  # SQLite = single writer. Keep exactly one replica, and use Recreate so the old pod
  # releases the database file before the new one starts (no two pods on one DB).
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: second-brain
  template:
    metadata:
      labels:
        app.kubernetes.io/name: second-brain
    spec:
      # The image entrypoint starts as root only to chown /app/db, then drops to the
      # unprivileged "nextjs" user (uid 1001) via gosu before running the server.
      securityContext:
        fsGroup: 1001
        seccompProfile:
          type: RuntimeDefault
      automountServiceAccountToken: false
      terminationGracePeriodSeconds: 30
      containers:
        - name: app
          # Built locally and imported into k3s (see README), or replace with your registry path.
          image: second-brain:1.0.0
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 3000
          envFrom:
            - configMapRef:
                name: second-brain-config
            - secretRef:
                name: second-brain-secrets
          volumeMounts:
            - name: data
              mountPath: /app/db
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              memory: 768Mi
          startupProbe:
            httpGet:
              path: /api/auth/setup-status
              port: http
            periodSeconds: 5
            failureThreshold: 24 # up to 2 minutes for first boot / schema creation
          readinessProbe:
            httpGet:
              path: /api/auth/setup-status
              port: http
            periodSeconds: 10
            timeoutSeconds: 5
          livenessProbe:
            httpGet:
              path: /api/auth/setup-status
              port: http
            periodSeconds: 30
            timeoutSeconds: 5
            failureThreshold: 3
          securityContext:
            # gosu only lowers privileges, so no escalation is needed. The added capabilities
            # cover the entrypoint's mkdir/chown/chmod of /app/db and the switch to uid 1001.
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
              add: ["CHOWN", "SETUID", "SETGID", "FOWNER", "DAC_OVERRIDE"]
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: second-brain-data
